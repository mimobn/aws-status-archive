name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Rebuild and verify
        run: |
          uv run python scripts/rebuild.py
          uv run python scripts/check_integrity.py

      - name: Assemble public site
        run: |
          rm -rf public
          mkdir -p public/parsed
          cp -R site/* public/
          cp out/incidents.json public/parsed/incidents.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        with:
          timeout: 1800000