name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows: [Archive]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
          python-version: "3.13"

      - name: Rebuild and verify
        run: |
          uv run --locked python scripts/rebuild.py
          uv run --locked python scripts/check_integrity.py

      - name: Assemble public site
        run: |
          rm -rf public
          mkdir -p public/parsed
          cp -R site/* public/
          cp out/incidents.json public/parsed/incidents.json
          cp out/metadata.json public/parsed/metadata.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          timeout: 1800000
