name: Test

on:
  push:
  pull_request:
  workflow_run:
    workflows: [Archive]
    types: [completed]
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
          python-version: "3.13"
      - name: Run tests
        run: uv run --locked python -m unittest discover -s tests
      - name: Rebuild and verify integrity
        run: |
          uv run --locked python scripts/rebuild.py
          uv run --locked python scripts/check_integrity.py