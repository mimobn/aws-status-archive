name: Archive

on:
  schedule:
    - cron: '5 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch AWS status archives
        run: python scripts/fetch_archive.py

      - name: Check archive shape
        run: python scripts/check_feed_shape.py --dir data

      - name: Report what changed
        run: |
          if git status --porcelain | grep -q .; then
            prev=$(mktemp -d)
            git show HEAD:data/historyevents.json > "$prev/historyevents.json" || true
            python scripts/diff_snapshots.py \
              --previous "$prev" \
              --current data \
              --json || true
            rm -rf "$prev"
          else
            echo "archives unchanged"
          fi

      - name: Commit snapshot
        run: |
          if git status --porcelain | grep -q .; then
            git config user.name "status-archive[bot]"
            git config user.email "status-archive[bot]@users.noreply.github.com"
            git add data/
            git commit -m "data: archive AWS status JSON snapshot"
            git push
          else
            echo "nothing to commit"
          fi
